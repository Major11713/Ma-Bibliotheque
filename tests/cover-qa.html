<!doctype html><html lang="fr"><meta charset="utf-8"><title>Test local de lecture de couverture</title>
<h1>Fixture synthétique — test OCR, pas un catalogue</h1><p>Ce test lit une image créée ici. Il ne fournit aucune fiche spéciale à l'application.</p>
<canvas id="sample" width="700" height="1000"></canvas><button id="run">Lire cette image test</button><button id="cancel">Annuler la lecture</button><pre id="output"></pre>
<script src="../vendor/ocr/tesseract.min.js"></script><script type="module">
import {readCoverPhoto,cancelCoverRecognition} from '../cover-search.js';
const canvas=document.getElementById('sample'),ctx=canvas.getContext('2d');
ctx.fillStyle='#fff';ctx.fillRect(0,0,700,1000);ctx.fillStyle='#17324d';ctx.textAlign='center';
ctx.font='bold 62px Arial';ctx.fillText('GLITTER GIRL',350,300);ctx.font='40px Arial';ctx.fillText('C. J. RONNIE',350,760);
document.getElementById('run').onclick=async()=>{
 const out=document.getElementById('output');out.textContent='Lecture…';
 const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
 try{out.textContent=await readCoverPhoto(new File([blob],'fixture.png',{type:'image/png'}),m=>{out.textContent=m.status+' '+Math.round(m.progress*100)+' %';})||'Annulé';}catch(e){out.textContent='ERREUR '+e.message;}
};
document.getElementById('cancel').onclick=()=>cancelCoverRecognition();
</script></html>
