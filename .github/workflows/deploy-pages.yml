name: Déployer Ma Bibliothèque

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v6
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Installer les dépendances de test
        run: npm ci --ignore-scripts
      - name: Vérifier les régressions avant publication
        run: npm run check
      - name: Préparer les fichiers de l’application
        run: node scripts/package-site.mjs
      - name: Préparer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "site"
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
